<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
  <title id="title">2026 新西兰南岛自驾行程顺序示意图</title>
  <desc id="desc">按日期顺序显示基督城、蒂卡波、特威泽尔、库克山、瓦纳卡、箭镇、皇后镇、蒂阿瑙、米尔福德峡湾及回程节点。示意图不按地理比例。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8f5"/>
      <stop offset="1" stop-color="#e4eee9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173d33" flood-opacity=".12"/>
    </filter>
    <style>
      .title { font: 700 44px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #173d33; }
      .subtitle { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4f6e65; }
      .phase { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #246b5a; }
      .nodeTitle { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #173d33; }
      .nodeNote { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5d756d; }
      .day { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5d756d; }
      .badge { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .legend { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #35584f; }
    </style>
  </defs>

  <rect width="1024" height="1536" fill="url(#bg)"/>
  <circle cx="900" cy="82" r="160" fill="#d7e7df" opacity=".7"/>
  <circle cx="92" cy="1445" r="220" fill="#dce9e4" opacity=".75"/>

  <text x="70" y="86" class="title">南岛自驾路线</text>
  <text x="70" y="124" class="subtitle">2026.09.26–10.06 · 行程顺序示意 · 不按地理比例</text>

  <g filter="url(#shadow)">
    <rect x="52" y="166" width="920" height="1204" rx="34" fill="#fff" opacity=".96"/>
  </g>

  <text x="86" y="224" class="phase">去程与皇后镇 · DAYS 3–9</text>
  <text x="542" y="224" class="phase">峡湾与回程 · DAYS 9–13</text>
  <line x1="512" y1="246" x2="512" y2="1082" stroke="#dbe6e1" stroke-width="2"/>

  <line x1="132" y1="290" x2="132" y2="985" stroke="#246b5a" stroke-width="7" stroke-linecap="round"/>
  <line x1="584" y1="290" x2="584" y2="1040" stroke="#246b5a" stroke-width="7" stroke-linecap="round"/>

  <g>
    <circle cx="132" cy="290" r="34" fill="#246b5a"/>
    <text x="132" y="296" class="day" text-anchor="middle">D3</text>
    <text x="185" y="283" class="nodeTitle">Christchurch 基督城</text>
    <text x="185" y="313" class="nodeNote">凌晨抵达 · 取车出发</text>
  </g>
  <g>
    <circle cx="132" cy="420" r="34" fill="#246b5a"/>
    <text x="132" y="426" class="day" text-anchor="middle">D3</text>
    <text x="185" y="413" class="nodeTitle">Lake Tekapo 蒂卡波</text>
    <text x="185" y="443" class="nodeNote">去程短停 30–60 分钟</text>
  </g>
  <g>
    <circle cx="132" cy="550" r="34" fill="#246b5a"/>
    <text x="132" y="556" class="day" text-anchor="middle">D3–5</text>
    <text x="185" y="543" class="nodeTitle">Twizel 特威泽尔</text>
    <text x="185" y="573" class="nodeNote">连住两晚 · 进山基地</text>
  </g>
  <path d="M166 574 C176 580 180 594 185 614" fill="none" stroke="#168aa0" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/>
  <rect x="185" y="600" width="278" height="54" rx="18" fill="#168aa0"/>
  <text x="205" y="634" class="badge">D4 ↔ Aoraki / Mt Cook 当天往返</text>

  <g>
    <circle cx="132" cy="725" r="34" fill="#246b5a"/>
    <text x="132" y="731" class="day" text-anchor="middle">D5–7</text>
    <text x="185" y="718" class="nodeTitle">Wānaka 瓦纳卡</text>
    <text x="185" y="748" class="nodeNote">经 Omarama · Lindis Pass</text>
  </g>
  <g>
    <circle cx="132" cy="855" r="34" fill="#246b5a"/>
    <text x="132" y="861" class="day" text-anchor="middle">D7</text>
    <text x="185" y="848" class="nodeTitle">Arrowtown 箭镇</text>
    <text x="185" y="878" class="nodeNote">午餐与短走</text>
  </g>
  <g>
    <circle cx="132" cy="985" r="34" fill="#246b5a"/>
    <text x="132" y="991" class="day" text-anchor="middle">D7–9</text>
    <text x="185" y="978" class="nodeTitle">Queenstown 皇后镇</text>
    <text x="185" y="1008" class="nodeNote">Crown Range / Cromwell 二选一</text>
  </g>

  <g>
    <circle cx="584" cy="290" r="34" fill="#246b5a"/>
    <text x="584" y="296" class="day" text-anchor="middle">D9</text>
    <text x="635" y="283" class="nodeTitle">Te Anau 蒂阿瑙</text>
    <text x="635" y="313" class="nodeNote">峡湾前夜基地</text>
  </g>
  <path d="M618 306 C630 316 634 332 635 350" fill="none" stroke="#168aa0" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/>
  <rect x="635" y="338" width="280" height="54" rx="18" fill="#168aa0"/>
  <text x="655" y="372" class="badge">D10 ↔ Milford Sound 当天往返</text>

  <g>
    <circle cx="584" cy="500" r="34" fill="#246b5a"/>
    <text x="584" y="506" class="day" text-anchor="middle">D11</text>
    <text x="635" y="493" class="nodeTitle">Queenstown 皇后镇</text>
    <text x="635" y="523" class="nodeNote">Milford 后恢复缓冲</text>
  </g>
  <g>
    <circle cx="584" cy="635" r="34" fill="#246b5a"/>
    <text x="584" y="641" class="day" text-anchor="middle">D12</text>
    <text x="635" y="628" class="nodeTitle">Cromwell 克伦威尔</text>
    <text x="635" y="658" class="nodeNote">咖啡、厕所、加油短停</text>
  </g>
  <g>
    <circle cx="584" cy="770" r="34" fill="#246b5a"/>
    <text x="584" y="776" class="day" text-anchor="middle">D12</text>
    <text x="635" y="763" class="nodeTitle">Omarama 奥玛拉玛</text>
    <text x="635" y="793" class="nodeNote">午餐 · 14:30 运行判断</text>
  </g>
  <g>
    <circle cx="584" cy="905" r="34" fill="#246b5a"/>
    <text x="584" y="911" class="day" text-anchor="middle">D12–13</text>
    <text x="635" y="898" class="nodeTitle">Lake Tekapo 蒂卡波</text>
    <text x="635" y="928" class="nodeNote">主方案过夜 · Pukaki 条件短停</text>
  </g>
  <g>
    <circle cx="584" cy="1040" r="34" fill="#246b5a"/>
    <text x="584" y="1046" class="day" text-anchor="middle">D13</text>
    <text x="635" y="1033" class="nodeTitle">Christchurch 基督城</text>
    <text x="635" y="1063" class="nodeNote">机场区域还车</text>
  </g>

  <g transform="translate(86 1112)">
    <rect width="852" height="218" rx="26" fill="#f5f8f6" stroke="#d9e6e0" stroke-width="2"/>
    <text x="28" y="44" class="phase">执行边界</text>
    <circle cx="40" cy="80" r="7" fill="#246b5a"/>
    <text x="60" y="87" class="small">Day 12 住宿固定为已预订的 Tekapo；延误时取消途中停靠</text>
    <circle cx="40" cy="118" r="7" fill="#c8832c"/>
    <text x="60" y="125" class="small">Lake Pukaki 只在天气、能见度和进度都合适时短停</text>
    <circle cx="40" cy="156" r="7" fill="#168aa0"/>
    <text x="60" y="163" class="small">Mt Cook 与 Milford 都从住宿基地当天往返</text>
    <circle cx="40" cy="194" r="7" fill="#7f928b"/>
    <text x="60" y="201" class="small">路线图只表达顺序；道路与封闭状态以 NZTA 当日信息为准</text>
  </g>

  <g transform="translate(70 1420)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#246b5a" stroke-width="8" stroke-linecap="round"/>
    <text x="86" y="7" class="legend">主路线</text>
    <line x1="220" y1="0" x2="290" y2="0" stroke="#168aa0" stroke-width="6" stroke-dasharray="10 8"/>
    <text x="306" y="7" class="legend">当天往返</text>
    <circle cx="520" cy="0" r="7" fill="#c8832c"/>
    <text x="538" y="7" class="legend">条件性短停 / 降级</text>
  </g>
  <text x="70" y="1480" class="small">本图不是导航地图，不按地理比例；逐段导航、施工和封路判断以出发当天信息为准。</text>
</svg>
